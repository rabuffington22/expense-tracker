name: Synthetic CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-synthetic:
    name: Core synthetic checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Enforce workflow safety contract
        run: python scripts/ci_safety_check.py
      - name: Run synthetic smoke suite
        run: python scripts/smoke_test.py
      - name: Check Python syntax
        run: python -m compileall -q core web scripts run.py
      - name: Check JavaScript syntax
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check
      - name: Validate command-center JSON
        run: python -m json.tool command-center/state.json > /dev/null
      - name: Check generated dashboard currentness
        run: node command-center/scripts/refresh-dashboard.js --check
      - name: Check command-center health
        run: node command-center/scripts/health-check.js --ci
      - name: Check pull-request whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
