name: Synthetic CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-synthetic:
    name: Core synthetic checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Enforce workflow safety contract
        run: python scripts/ci_safety_check.py
      - name: Run synthetic smoke suite
        run: python scripts/smoke_test.py
      - name: Check Python syntax
        run: python -m compileall -q core web scripts run.py
      - name: Check JavaScript syntax
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check
      - name: Validate command-center JSON
        run: python -m json.tool command-center/state.json > /dev/null
      - name: Check generated dashboard currentness
        run: node command-center/scripts/refresh-dashboard.js --check
      - name: Check command-center health
        run: node command-center/scripts/health-check.js --ci
      - name: Check pull-request whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD

  browser-synthetic:
    name: Isolated browser checks
    needs: core-synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify installed Google Chrome
        run: google-chrome --version
      - name: Install browser-test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run isolated browser suite
        run: python scripts/mobile_drawer_browser_test.py
